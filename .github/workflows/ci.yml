name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: 'file:./ci.db'
      AUTH_MODE: 'stub'
      STUB_TENANT_ID: 'tnt_test'
      STUB_USER_ID: 'usr_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Type-check + build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e

  frontend:
    name: Frontend (type-check + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      NEXT_PUBLIC_API_URL: 'http://localhost:3333/api'
      NEXT_PUBLIC_USE_MOCKS: 'true'
      NEXT_PUBLIC_API_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  # O E2E exercita a tela contra a API de verdade. Com NEXT_PUBLIC_USE_MOCKS=true
  # e sem backend, os testes do calendario falhavam: eles criam a propria massa
  # de dados via API justamente para nao depender do estado do seed.
  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: 'http://localhost:3333/api'
      NEXT_PUBLIC_USE_MOCKS: 'false'
      NEXT_PUBLIC_API_TIMEOUT: '30000'
      DATABASE_URL: 'file:./e2e.db'
      AUTH_MODE: 'stub'
      # Precisa bater com o TENANT_ID do seed, senao o guard resolve um tenant
      # sem dado nenhum e a tela abre vazia.
      STUB_TENANT_ID: 'tnt_dev'
      STUB_USER_ID: 'usr_dev'
      # BrasilAPI falsa: a real deixaria a CI refem da rede e do rate limit de
      # terceiro, e sem feriado algum o teste do aviso de feriado nao teria o
      # que verificar.
      BRASILAPI_BASE_URL: 'http://localhost:4444/api'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend
        working-directory: apps/backend
        run: npm ci
      - name: Prepare database
        working-directory: apps/backend
        run: npx prisma migrate deploy && npx prisma generate
      - name: Seed
        working-directory: apps/backend
        run: npm run db:seed
      - name: Build backend
        working-directory: apps/backend
        run: npm run build
      - name: Start fake BrasilAPI
        working-directory: apps/backend
        run: node test/fake-brasilapi.mjs 4444 &
      - name: Start backend
        working-directory: apps/backend
        run: |
          npm run start:prod &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3333/api/health > /dev/null; then
              echo "backend no ar"
              exit 0
            fi
            sleep 1
          done
          echo "backend nao subiu em 60s"
          exit 1

      - name: Install frontend
        working-directory: apps/frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: apps/frontend
        run: npm run e2e
